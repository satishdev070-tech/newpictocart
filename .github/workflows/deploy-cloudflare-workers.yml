# Production frontend deploy: vinext → Cloudflare Worker `pictocart` (Airy Fact).
# Do NOT use GitHub “Workers Builds: newpictocart” (wrong Cloudflare account).
# Required repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, APP_SECRET,
# CRON_SECRET, NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,
# SUPABASE_SECRET_KEY (and optional PLATFORM_HOST_ALIASES / WORKERS_DEV_HOST).
name: Deploy Cloudflare Workers

on:
  push:
    branches:
      - main
      - cursor/prod-cf-full-cutover-c73e
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-workers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build vinext Worker
        env:
          NEXT_PUBLIC_PLATFORM_ROOT_DOMAIN: pictocart.in
          NEXT_PUBLIC_PLATFORM_URL: https://www.pictocart.in
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          PLATFORM_HOST_ALIASES: ${{ secrets.PLATFORM_HOST_ALIASES }}
          WORKERS_DEV_HOST: ${{ secrets.WORKERS_DEV_HOST }}
        run: |
          export PLATFORM_HOST_ALIASES="${PLATFORM_HOST_ALIASES:-pictocartdev.in,www.pictocartdev.in}"
          export WORKERS_DEV_HOST="${WORKERS_DEV_HOST:-pictocart.airy-fact.workers.dev}"
          pnpm run build:vinext
      - name: Write Worker secrets file
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          PLATFORM_HOST_ALIASES: ${{ secrets.PLATFORM_HOST_ALIASES }}
          WORKERS_DEV_HOST: ${{ secrets.WORKERS_DEV_HOST }}
        run: |
          set -euo pipefail
          : "${APP_SECRET:?missing APP_SECRET}"
          : "${CRON_SECRET:?missing CRON_SECRET}"
          : "${SUPABASE_SECRET_KEY:?missing SUPABASE_SECRET_KEY}"
          : "${NEXT_PUBLIC_SUPABASE_URL:?missing NEXT_PUBLIC_SUPABASE_URL}"
          : "${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?missing NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}"
          {
            printf 'APP_SECRET=%s\n' "$APP_SECRET"
            printf 'CRON_SECRET=%s\n' "$CRON_SECRET"
            printf 'SUPABASE_SECRET_KEY=%s\n' "$SUPABASE_SECRET_KEY"
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$NEXT_PUBLIC_SUPABASE_URL"
            printf 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
            printf 'NEXT_PUBLIC_PLATFORM_ROOT_DOMAIN=pictocart.in\n'
            printf 'NEXT_PUBLIC_PLATFORM_URL=https://www.pictocart.in\n'
            printf 'PLATFORM_HOST_ALIASES=%s\n' "${PLATFORM_HOST_ALIASES:-pictocartdev.in,www.pictocartdev.in}"
            printf 'WORKERS_DEV_HOST=%s\n' "${WORKERS_DEV_HOST:-pictocart.airy-fact.workers.dev}"
          } > /tmp/worker-secrets.env
      - name: Deploy to Cloudflare (Airy Fact / pictocart)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx cf deploy --prebuilt --secrets-file /tmp/worker-secrets.env --message "gha:${{ github.sha }}"
      - name: Post-deploy preview-token self-test
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            body=$(curl -fsS -H "Authorization: Bearer ${CRON_SECRET}" \
              "https://www.pictocart.in/api/cron/preview-token-self-test" || true)
            echo "$body"
            echo "$body" | grep -q '"mintVerify":"ok"' && exit 0
            sleep 5
          done
          echo "self-test failed" >&2
          exit 1
